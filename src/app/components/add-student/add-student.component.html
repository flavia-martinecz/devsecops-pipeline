<div class="add-student">
  <h2>Add New Student</h2>

  <div class="page-layout">
    <div class="form-side">
      <div class="success-card" *ngIf="success">
        <div>
          <strong>{{ addedName }}</strong> was added successfully!
          <div class="success-actions">
            <button (click)="success = false">Add another student</button>
            <button class="secondary" (click)="goToList()">
              View student list
            </button>
          </div>
        </div>
      </div>

      <form class="student-form" (ngSubmit)="onSubmit()" *ngIf="!success">
        <div class="form-group">
          <label for="name">Full name</label>
          <input
            id="name"
            type="text"
            [(ngModel)]="name"
            name="name"
            placeholder="e.g. Ion Popescu"
            autocomplete="off"
          />
        </div>

        <div class="form-group">
          <label for="email">University email</label>
          <input
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="e.g. ion.popescu@student.upt.ro"
            autocomplete="off"
          />
        </div>

        <div class="form-group">
          <label for="faculty">Faculty</label>
          <select id="faculty" [(ngModel)]="faculty" name="faculty">
            <option value="">-- Select faculty --</option>
            <option *ngFor="let f of faculties" [value]="f">{{ f }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="cycle">Study cycle</label>
          <select
            id="cycle"
            [(ngModel)]="cycle"
            name="cycle"
            (ngModelChange)="onCycleChange()"
          >
            <option value="">-- Select cycle --</option>
            <option value="Bachelor">Bachelor</option>
            <option value="Master">Master</option>
          </select>
        </div>

        <div class="form-group">
          <label for="year">Year of study</label>
          <select id="year" [(ngModel)]="year" name="year">
            <option [value]="1">Year 1</option>
            <option [value]="2">Year 2</option>
            <option *ngIf="cycle !== 'Master'" [value]="3">Year 3</option>
            <option *ngIf="cycle !== 'Master'" [value]="4">Year 4</option>
          </select>
        </div>

        <p class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</p>

        <div class="form-actions">
          <button type="submit">Add Student</button>
          <a routerLink="/students" class="cancel-link">Cancel</a>
        </div>
      </form>
    </div>

    <div class="image-side">
      <img src="assets/imgs/new_student.jpg" alt="New student" />
    </div>
  </div>
</div>
