<div class="search-page">
  <h2>Student Search</h2>

  <div class="search-box">
    <input
      type="text"
      [(ngModel)]="searchQuery"
      placeholder="Search by name, faculty or email..."
      (keyup.enter)="onSearch()"
    />
    <button (click)="onSearch()">Search</button>
  </div>

  <div class="filter-tags">
    <span class="tag" (click)="quickSearch('Automation')">Automation</span>
    <span class="tag" (click)="quickSearch('Electronics')">Electronics</span>
    <span class="tag" (click)="quickSearch('Mechanical')">Mechanical</span>
    <span class="tag" (click)="quickSearch('Chemistry')">Chemistry</span>
    <span class="tag" (click)="quickSearch('Civil')">Civil</span>
  </div>

  <p *ngIf="searched && results.length > 0" class="result-header">
    Results for: <strong>{{ searchQuery }}</strong> ({{ results.length }} found)
  </p>

  <div class="results" *ngIf="results.length > 0">
    <div class="result-card" *ngFor="let s of results">
      <div class="result-top">
        <strong>{{ s.name }}</strong>
        <span class="year-badge">Year {{ s.year }}</span>
      </div>
      <span class="faculty">{{ s.faculty }}</span>
      <small>{{ s.email }}</small>
    </div>
  </div>

  <p *ngIf="searched && results.length === 0" class="no-results">
    No results for "{{ searchQuery }}".
  </p>
</div>
